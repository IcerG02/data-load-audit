[project]
name = "loadaudit"
version = "1.0.0"
description = "Reconcile bulk data loads and prove which record groups were (not) touched"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loadaudit = "loadaudit.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
